name: Build APK (CI)

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Generate Gradle wrapper
        env:
          SKIP_SIGNING: "true"
        run: gradle wrapper --no-daemon

      - name: Run unit tests and build APK
        env:
          SKIP_SIGNING: "true"
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong|Dependency .* requires|compileSdk|Android Gradle plugin' -A3 build.log | head -80 || true
            exit 1
          }

      - name: Read app version
        id: version
        env:
          SKIP_SIGNING: "true"
        run: |
          ./gradlew --no-daemon writeVersionForCi
          VERSION=$(cat app/build/outputs/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "ShizuCallRecorder-${VERSION}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizuCallRecorder-debug-${{ github.sha }}
          path: ShizuCallRecorder-*-debug.apk
          if-no-files-found: error
          retention-days: 14
