name: Build APK (CI)

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-9.4.1-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.4.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        env:
          SKIP_SIGNING: "true"
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION="${VERSION:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "ShizuCallRecorder-${VERSION}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizuCallRecorder-debug-${{ github.sha }}
          path: ShizuCallRecorder-*-debug.apk
          if-no-files-found: error
          retention-days: 14
